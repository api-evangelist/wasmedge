aid: wasmedge
name: WasmEdge
description: >-
  WasmEdge is a lightweight, high-performance, and extensible WebAssembly
  runtime for cloud native, edge, and decentralized applications. It powers
  serverless apps, embedded functions, microservices, smart contracts, and IoT
  devices. WasmEdge is a CNCF sandbox project providing an LLVM-based AoT
  compiler for maximum performance, and supporting WASI extensions for
  non-blocking networking, database access, and AI inference via TensorFlow,
  PyTorch, and OpenVINO.
